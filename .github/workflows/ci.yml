name: tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        run: |
          set -euo pipefail
          V=4.7.1
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mkdir -p "$HOME/.local/bin"
          mv Godot_v${V}-stable_linux.x86_64 "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"

      - name: Import project resources
        run: $HOME/.local/bin/godot --headless --path . --quit || true

      - name: Godot suites
        run: |
          set -euo pipefail
          for t in tests/test_*.gd; do
            GODOT_BIN="$HOME/.local/bin/godot" ./tools/tests/run_godot_test.sh "$t" 300
          done

      - name: Python suites
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/asset_pipeline -q

      - name: Shell suites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          scripts=(tests/pool/test_*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "FAIL: tests/pool/test_*.sh matched no files; treating an empty shell suite as a failure (fail closed)." >&2
            exit 1
          fi
          # Exit 77 is a distinct, deliberate "SKIPPED" signal (see
          # tests/pool/test_lock.sh's write-access probe): this repo's
          # GH_TOKEN is read-only by policy, so that suite cannot exercise
          # the mutex's actual compare-and-swap here. 0 stays a pass, 77 is
          # logged loudly as a skip and does not fail the step, and any
          # other non-zero still fails the step immediately -- same as
          # before this existed.
          for t in "${scripts[@]}"; do
            bash "$t"
            rc=$?
            if [ "$rc" -eq 77 ]; then
              echo "::warning::SKIPPED $t (exit 77) -- see its own output above for what could not be verified. This is NOT a pass."
              continue
            fi
            if [ "$rc" -ne 0 ]; then
              echo "FAIL: $t exited $rc" >&2
              exit "$rc"
            fi
          done
